slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: odom
    base_frame: base_link
    map_frame: map

    resolution: 0.05          # 5 cm map
    max_laser_range: 12.0
    minimum_travel_distance: 0.015
    minimum_travel_heading: 0.015

    transform_publish_period: 0.02
    mode: "mapping"
    enable_interactive_mode: false

    map_update_interval: 0.15 
    scan_topic: /scan
    scan_queue_size: 1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

